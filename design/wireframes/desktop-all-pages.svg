<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1800" role="img" aria-labelledby="t d"><title id="t">Desktop website architecture wireframes</title><desc id="d">Annotated desktop layouts covering homepage sections, every required route and system states.</desc><rect width="1800" height="1800" fill="#171512"/><g font-family="Arial,sans-serif" fill="#F4E7C5"><text x="45" y="55" font-size="34">DESKTOP 1440px — DESIGN ONLY — PROVISIONAL / NO COLLECTION</text><g id="home" transform="translate(45 90)"><rect width="1120" height="900" fill="#2B2721" stroke="#D9A441" stroke-width="6"/><rect x="25" y="25" width="1070" height="60" fill="#4F7A57"/><text x="45" y="63">Skip · Wordmark placeholder · Primary nav · CTA</text><rect x="25" y="105" width="1070" height="205" fill="#4F7A57"/><text x="50" y="160">Hero: statement + two literal actions</text><rect x="25" y="330" width="1070" height="95" fill="#4F7A57"/><text x="50" y="380">Brand explanation</text><rect x="25" y="445" width="520" height="140" fill="#4F7A57"/><rect x="575" y="445" width="520" height="140" fill="#4F7A57"/><text x="50" y="500">Featured merch — NOT FOR SALE</text><text x="600" y="500">Character — PROVISIONAL</text><rect x="25" y="605" width="700" height="130" fill="#4F7A57"/><rect x="755" y="605" width="340" height="130" fill="#4F7A57"/><text x="50" y="665">Latest skit + captions/transcript</text><text x="780" y="665">Noticeboard</text><rect x="25" y="755" width="1070" height="120" fill="#4F7A57"/><text x="50" y="815">Email/social placeholders · footer disclaimer</text></g><g id="route-grid" transform="translate(45 1040)" font-size="18"><text font-size="28">Route/template coverage</text><g fill="#2B2721" stroke="#D9A441" stroke-width="3"><rect y="45" width="270" height="90"/><rect x="290" y="45" width="270" height="90"/><rect x="580" y="45" width="270" height="90"/><rect x="870" y="45" width="270" height="90"/><rect y="155" width="270" height="90"/><rect x="290" y="155" width="270" height="90"/><rect x="580" y="155" width="270" height="90"/><rect x="870" y="155" width="270" height="90"/><rect y="265" width="270" height="90"/><rect x="290" y="265" width="270" height="90"/><rect x="580" y="265" width="270" height="90"/><rect x="870" y="265" width="270" height="90"/><rect y="375" width="270" height="90"/><rect x="290" y="375" width="270" height="90"/><rect x="580" y="375" width="270" height="90"/><rect x="870" y="375" width="270" height="90"/></g><text x="15" y="95">Shop/index + detail</text><text x="305" y="95">Tales/index + detail</text><text x="595" y="95">Characters/index + detail</text><text x="885" y="95">About Tavern / ALE</text><text x="15" y="205">Submit — NO COLLECTION</text><text x="305" y="205">FAQ</text><text x="595" y="205">Contact placeholder</text><text x="885" y="205">Shipping</text><text x="15" y="315">Returns</text><text x="305" y="315">Privacy placeholder</text><text x="595" y="315">Terms placeholder</text><text x="885" y="315">404 recovery</text><text x="15" y="425">Loading</text><text x="305" y="425">Empty</text><text x="595" y="425">Error</text><text x="885" y="425">Validation/disabled</text></g><g id="annotations" transform="translate(1210 100)" font-size="20"><text font-size="28">Desktop rules</text><text y="60">• 2–3 columns where order survives</text><text y="100">• Keyboard and visible focus</text><text y="140">• Responsive reserved media</text><text y="180">• 200% zoom/reflow</text><text y="220">• No hover-only interaction</text><text y="260">• Lazy load below fold</text><text y="300">• ≤100KB initial JS proposal</text><text y="340">• LCP/INP/CLS budgets defined</text><text y="380">• Analytics inactive</text><text y="420">• No live integrations</text><text y="460">• Identity/roster provisional</text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1500" role="img" aria-labelledby="t"><title id="t">Desktop template family evidence</title><rect width="1800" height="1500" fill="#171512"/><g font-family="Arial,sans-serif" fill="#F4E7C5" font-size="20"><text x="40" y="50" font-size="32">DESKTOP TEMPLATE FAMILIES — PROVISIONAL / NO COLLECTION</text><g id="listing-template" transform="translate(40 90)"><rect width="540" height="300" fill="#2B2721" stroke="#D9A441"/><text x="15" y="35">LISTING · filter + three-card grid</text><rect x="15" y="60" width="155" height="180" fill="#4F7A57"/><rect x="192" y="60" width="155" height="180" fill="#4F7A57"/><rect x="370" y="60" width="155" height="180" fill="#4F7A57"/></g><g id="commerce-detail-template" transform="translate(620 90)"><rect width="540" height="300" fill="#2B2721" stroke="#D9A441"/><text x="15" y="35">COMMERCE DETAIL</text><rect x="15" y="60" width="250" height="200" fill="#4F7A57"/><text x="285" y="100">facts + size/care</text><text x="285" y="140">Fourthwall handoff</text><text x="285" y="180">NO PAYMENT DATA</text></g><g id="tale-detail-template" transform="translate(1200 90)"><rect width="540" height="300" fill="#2B2721" stroke="#D9A441"/><text x="15" y="35">TALE PLAYER | transcript/related</text><rect x="15" y="60" width="320" height="200" fill="#4F7A57"/></g><g id="character-index-template" transform="translate(40 430)"><rect width="400" height="250" fill="#2B2721" stroke="#D9A441"/><text x="15" y="35">CHARACTER INDEX — PROVISIONAL</text></g><g id="character-detail-template" transform="translate(470 430)"><rect width="400" height="250" fill="#2B2721" stroke="#D9A441"/><text x="15" y="35">CHARACTER DETAIL — PROVISIONAL</text></g><g id="informational-template" transform="translate(900 430)"><rect width="400" height="250" fill="#2B2721" stroke="#D9A441"/><text x="15" y="35">INFO / LEGAL / SUPPORT · 72ch</text></g><g id="disabled-submit-template" transform="translate(1330 430)"><rect width="410" height="250" fill="#FFF8E8" stroke="#C85A3A" stroke-width="5"/><text x="15" y="38" fill="#211D18">SUBMIT · NO COLLECTION</text><text x="15" y="80" fill="#211D18">disabled · no endpoint</text></g><g id="faq-contact-template" transform="translate(40 720)"><rect width="820" height="220" fill="#2B2721" stroke="#D9A441"/><text x="15" y="35">FAQ disclosure grid / CONTACT placeholder</text></g><g id="system-template" transform="translate(900 720)"><rect width="840" height="220" fill="#2B2721" stroke="#D9A441"/><text x="15" y="35">404 / LOADING / EMPTY / ERROR / VALIDATION</text><text x="15" y="80">recovery action · announcement · focus target</text></g></g></svg>

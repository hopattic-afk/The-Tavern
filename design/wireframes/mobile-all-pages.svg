<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2400" role="img" aria-labelledby="t d"><title id="t">Mobile website architecture wireframes</title><desc id="d">Annotated mobile layouts covering the homepage, all required page templates and system states.</desc><rect width="1200" height="2400" fill="#171512"/><g font-family="Arial,sans-serif" fill="#F4E7C5"><text x="40" y="55" font-size="32">MOBILE 360px — DESIGN ONLY — PROVISIONAL / NO COLLECTION</text><g id="home" transform="translate(40 90)"><rect width="360" height="1180" fill="#2B2721" stroke="#D9A441" stroke-width="5"/><text x="20" y="40">Skip link · Header · Menu</text><g fill="#4F7A57"><rect x="20" y="70" width="320" height="150"/><rect x="20" y="240" width="320" height="105"/><rect x="20" y="365" width="320" height="125"/><rect x="20" y="510" width="320" height="125"/><rect x="20" y="655" width="320" height="125"/><rect x="20" y="800" width="320" height="95"/><rect x="20" y="915" width="320" height="85"/><rect x="20" y="1020" width="320" height="130"/></g><g font-size="18"><text x="35" y="120">Hero + literal CTAs</text><text x="35" y="285">Brand explanation</text><text x="35" y="410">Featured merch — NOT FOR SALE</text><text x="35" y="555">Featured character — PROVISIONAL</text><text x="35" y="700">Latest skit + transcript</text><text x="35" y="845">Tavern noticeboard</text><text x="35" y="960">Email/social placeholders</text><text x="35" y="1070">Footer + disclaimer</text></g></g><g id="templates" transform="translate(440 90)" font-size="18"><text y="25" font-size="26">Required page/template stack</text><g fill="#2B2721" stroke="#D9A441"><rect y="50" width="330" height="100"/><rect y="165" width="330" height="100"/><rect y="280" width="330" height="100"/><rect y="395" width="330" height="100"/><rect y="510" width="330" height="100"/><rect y="625" width="330" height="100"/><rect y="740" width="330" height="100"/><rect y="855" width="330" height="100"/><rect y="970" width="330" height="100"/><rect y="1085" width="330" height="100"/><rect y="1200" width="330" height="100"/><rect y="1315" width="330" height="100"/><rect y="1430" width="330" height="100"/><rect y="1545" width="330" height="100"/><rect y="1660" width="330" height="100"/><rect y="1775" width="330" height="100"/></g><text x="15" y="90">Shop + product detail</text><text x="15" y="205">Tales + tale detail</text><text x="15" y="320">Trash Pandas + profile</text><text x="15" y="435">About Tavern</text><text x="15" y="550">About ALE — public-safe</text><text x="15" y="665">Submit — NO COLLECTION</text><text x="15" y="780">FAQ</text><text x="15" y="895">Contact placeholder</text><text x="15" y="1010">Shipping</text><text x="15" y="1125">Returns</text><text x="15" y="1240">Privacy placeholder</text><text x="15" y="1355">Terms placeholder</text><text x="15" y="1470">404 recovery</text><text x="15" y="1585">Loading</text><text x="15" y="1700">Empty</text><text x="15" y="1815">Error / validation summary</text></g><g id="annotations" transform="translate(820 90)" font-size="19"><text font-size="26">Annotations</text><text y="60">• One column; logical source order</text><text y="95">• 44×44 minimum targets</text><text y="130">• Visible focus + skip link</text><text y="165">• 72ch max reading width</text><text y="200">• Captions + transcript</text><text y="235">• No autoplay audio/motion</text><text y="270">• Reduced motion: no transforms</text><text y="305">• Provisional assets labeled</text><text y="340">• Forms disabled/no endpoints</text><text y="375">• Fourthwall outbound only</text><text y="410">• Disclaimer in footer/legal</text><text y="445">• Empty/error/loading defined</text></g></g></svg>
